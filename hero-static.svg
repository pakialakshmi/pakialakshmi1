<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="sd-hero-title sd-hero-desc">
  <title id="sd-hero-title">pakialakshmi</title>
  <desc id="sd-hero-desc">UI/UX Designer, Front-End Developer, Creative Technologist</desc>
  <defs>
    <linearGradient id="sd-hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#1B0B12"/>
      <stop offset="1" stop-color="#431126"/>
    </linearGradient>
    <radialGradient id="sd-hero-glow" cx="0.82" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sd-hero-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>
    <linearGradient id="sd-hero-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8F0F3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F8F0F3" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F8F0F3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sd-hero-ink" x1="0" y1="0" x2="1" y2="0">
