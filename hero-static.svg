    </pattern>
    <filter id="sd-hero-blur" x="-20%" y="-400%" width="140%" height="900%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="sd-hero-soft" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3.5"/></filter>
    <clipPath id="sd-hero-card"><rect width="1200" height="360" rx="18"/></clipPath>
    <clipPath id="sd-hero-ruleclip"><rect x="72" y="248" width="360" height="3" rx="1.5"/></clipPath>
  </defs>

