    </g>

    <rect x="72" y="57" width="28" height="1.5" fill="#C77B9B"/>
    <text x="112" y="63" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="12" letter-spacing="4" fill="#C77B9B" opacity="0.85">DEVELOPER PROFILE</text>

    <g>
      
      <text x="70" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" letter-spacing="1" fill="url(#sd-hero-ink)">pakialakshmi</text>
      <text x="72" y="216" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="15" letter-spacing="2.4" fill="#C77B9B">UI/UX DESIGNER · FRONT-END DEVELOPER · CREATIVE TECHNOLOGIST</text>
    </g>

    <rect x="72" y="248" width="360" height="3" fill="url(#sd-hero-rule)" filter="url(#sd-hero-blur)" opacity="0.7">
      
    </rect>
    <rect x="72" y="248" width="360" height="3" rx="1.5" fill="url(#sd-hero-rule)"/>
    

    <text x="72" y="298" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#E5B5C7" opacity="0.78">Designing interfaces. Engineering experiences.</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="18" fill="none" stroke="#C77B9B" stroke-opacity="0.2"/>
