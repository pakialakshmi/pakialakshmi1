    <g transform="translate(985 180) rotate(26)" fill="none" stroke="#C77B9B" stroke-width="1">
      <ellipse rx="140" ry="52" stroke-opacity="0.26" stroke-dasharray="2 8"/>
      <ellipse rx="165" ry="62" stroke-opacity="0.14"/>
      <circle cx="-131.6" cy="-17.8" r="3.4" fill="#E5B5C7"/>
    </g>
    <circle cx="985" cy="180" r="15" fill="#C77B9B" opacity="0.55" filter="url(#sd-hero-soft)"/>
    <circle cx="985" cy="180" r="5.5" fill="#F8F0F3"/>
    

    <g fill="none" stroke="#C77B9B" stroke-opacity="0.4" stroke-width="1.2">
      <path d="M24 44V24H44"/><path d="M1176 44V24H1156"/>
