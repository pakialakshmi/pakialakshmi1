    <rect width="1200" height="360" fill="url(#sd-hero-glow)"/>
    <rect width="1200" height="360" fill="url(#sd-hero-grid)" mask="url(#sd-hero-gridmask)"/>

    <g transform="translate(985 180) rotate(-18)" fill="none" stroke="#C77B9B" stroke-width="1">
      <ellipse rx="90" ry="34" stroke-opacity="0.40"/>
